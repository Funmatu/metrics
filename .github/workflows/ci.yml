name: Continuous integration

on:
  push:
    branches: [ master ]

jobs:

  # Build, test and analyze
  build-test-analyze:
    name: Build, test and analyze
    if: "!contains(github.event.head_commit.message, '[skip test]')"
    uses: ./.github/workflows/test.yml

  # Build and publish Docker image to ghcr.io after tests pass
  publish-docker:
    name: Publish Docker image to ghcr.io
    runs-on: ubuntu-latest
    needs: [ build-test-analyze ]
    timeout-minutes: 90
    # Pushing to ghcr.io needs packages:write, which is how publish-docker.yml is set up - the
    # only workflow that has managed to publish the image so far
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # This repository defines no PERSONAL_ACCESS_TOKEN, so the login step failed on every
          # push to master since 2026-05-01 and the image was never rebuilt from CI
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push ghcr.io/funmatu/metrics:master
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/funmatu/metrics:master
          cache-from: type=gha
          cache-to: type=gha,mode=max
